name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Nightly full cross-browser E2E run on main (the PR path stays lean - see below).
  schedule:
    - cron: '0 3 * * *'

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Verify MSW v2 compliance
        run: |
          echo "Verifying MSW v2 compliance..."
          node src/test/verify-msw-v2.mjs
          npm ls msw

      - name: Unit tests (Vitest)
        run: npx vitest run --config vitest.config.ts
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build

      # Cache the Playwright browser binaries (keyed on the Playwright version) so we
      # do not re-download ~300MB every run.
      - name: Playwright version
        id: pw
        run: |
          V=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # The route guard (below) drives chromium, so chromium is installed on every run.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # Hard gate: fails the build if any sitemap URL renders the Not Found page
      # (an orphan URL with no real route, e.g. the /courses soft-404). Runs after
      # Build (needs dist + sitemap) and chromium install.
      - name: Route guard (soft-404 check)
        run: npm run check:routes

      # The full cross-browser E2E and BDD suites are the slow part of CI (~15 min) and,
      # until Supabase is seeded/mocked in CI, they are non-gating (continue-on-error) -
      # they cannot pass without live DB data. So they run on pushes to main and the
      # nightly schedule, NOT on every PR, keeping PR feedback to a few minutes.
      # TODO: seed/mock the DB so these become deterministic and can gate PRs again.
      - name: Install Playwright firefox + webkit
        if: github.ref == 'refs/heads/main'
        run: npx playwright install --with-deps firefox webkit

      - name: E2E tests (Playwright)
        if: github.ref == 'refs/heads/main'
        run: npx playwright test
        continue-on-error: true

      - name: BDD smoke tests
        if: github.ref == 'refs/heads/main'
        run: npm run bdd:smoke
        continue-on-error: true

      - name: Upload Vitest results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('coverage/**') != ''
        with:
          name: vitest-results
          path: coverage/
          retention-days: 30

      - name: Upload Playwright results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('test-results/**') != ''
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: Upload BDD results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('reports/**') != ''
        with:
          name: bdd-cucumber-results
          path: |
            reports/
            screenshots/
          retention-days: 30

  # The Next site (apps/web) is a separate npm project (own lockfile) and the public
  # SEO/lead-gen surface. Without this job a broken Next build or type error only
  # surfaces when Vercel fails AFTER merge. Runs in parallel with the SPA job above.
  web-next:
    name: Next site (apps/web)
    runs-on: ubuntu-latest

    env:
      # Same Supabase project as the SPA; Next reads the NEXT_PUBLIC_ names. Pages are
      # dynamic so the build does not fetch, but provide them to match production.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Resolves the committed @altogether/ui (file:../../packages/ui) from the checkout.
      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Lint
        run: npm run lint
        working-directory: apps/web

      # Smoke tests for the lead-gen forms (contact + coaching): render, validation
      # gate, and the exact insert shape (enquiry_type/status) a DB constraint once rejected.
      - name: Unit tests (Vitest)
        run: npm test
        working-directory: apps/web

      # next build gates on TypeScript + ESLint errors and compiles every route.
      - name: Build (type-check + build)
        run: npm run build
        working-directory: apps/web
